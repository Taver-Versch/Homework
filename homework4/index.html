<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HW4</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="menu-container">
    <h1>TAVER'S OSRS DUNGEON</h1>

    <div class="section">
      <h2>ADD ARTIFACT</h2>
      <div class="form-group">
        <label for="artifactName">Artifact Name:</label>
        <input type="text" id="artifactName" placeholder="Enter artifact name...">
      </div>
      <div class="form-group">
        <label for="artifactType">Type:</label>
        <select id="artifactType">
          <option value="">Select Type</option>
          <option value="Weapon">Weapon</option>
          <option value="Armor">Armor</option>
          <option value="Accessory">Accessory</option>
        </select>
      </div>
      <div class="form-group">
        <label for="artifactRarity">Rarity:</label>
        <select id="artifactRarity">
          <option value="">Select Rarity</option>
          <option value="Common">Common</option>
          <option value="Uncommon">Uncommon</option>
          <option value="Rare">Rare</option>
          <option value="Epic">Epic</option>
          <option value="Legendary">Legendary</option>
        </select>
      </div>
      <div class="form-group">
        <label for="artifactPower">Power Level:</label>
        <input type="number" id="artifactPower" placeholder="1-99" min="1" max="100">
      </div>
      <button onclick="addArtifact()">Add to Vault</button>
      <div id="addMessage" class="message" style="display:none;"></div>
    </div>

    <div class="section">
      <h2>SEARCH ARTIFACT</h2>
      <div class="form-group">
        <label for="searchName">Artifact Name:</label>
        <input type="text" id="searchName" placeholder="Search by name...">
      </div>
      <button onclick="searchArtifact()">Search</button>
      <div id="searchResult" class="message" style="display:none;"></div>
    </div>

    <div class="section">
      <h2>REMOVE ARTIFACT</h2>
      <div class="form-group">
        <label for="removeName">Artifact Name:</label>
        <input type="text" id="removeName" placeholder="Enter name to remove...">
      </div>
      <button onclick="removeArtifact()">Remove from Vault</button>
      <div id="removeMessage" class="message" style="display:none;"></div>
    </div>

    <div class="section">
      <h2>VAULT CONTENTS</h2>
      <div class="controls">
        <button onclick="sortByName()">Sort by Name</button>
        <button onclick="sortByRarity()">Sort by Rarity</button>
        <button onclick="sortByPower()">Sort by Power</button>
        <button onclick="filterByType()">Filter by Type</button>
      </div>
      <div id="vaultDisplay" class="artifact-list"></div>
    </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
