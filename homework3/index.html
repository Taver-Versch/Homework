<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Monster Bash</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <header class="header">
        <h1>🎃</h1>
      <h1>Monster Bash</h1>
    </header>

    <main class="content">
      <section class="cards">
        <div class="card">
          <h2>Hero</h2>
          <p><strong>HP ❤️:</strong> 100 / 100</p>
          <p><strong>Energy ⚡:</strong> 20</p>
        </div>

        <div class="card">
          <!--<h2>Monster</h2>-->
          <h2><strong>🧟 Zombie</strong></h2>
          <p><strong>HP ❤️:</strong> 22 / 22</p>
        </div>
      </section>

      <section class="attacks">
        <h3>Choose an attack</h3>
        <div class="attack-buttons">
          <button type="button" class="btn">⚪ Wind Strike (2⚡ | Dmg 4)</button>
          <button type="button" class="btn">⚕️ Water Bolt (5⚡ | Dmg 11)</button>
          <button type="button" class="btn">💢 Fire Wave (13⚡ | Dmg 20)</button>
        </div>
      </section>

      <section class="log">
        <h3>Battle Log</h3>
        <div class="log-box">
          <div class="log-line">Hero used an attack for 10 damage!</div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
