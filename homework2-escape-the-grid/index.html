<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>A* Pathfinding Demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Escape the Grid: A* Search</h1>

<div id="controls">
  <button id="run">Run A*</button>
  <button id="reset">Reset Grid</button>
  <label for="density">Obstacle Density:</label>
  <input type="range" id="density" min="0" max="0.5" step="0.01" value="0.2">
  <span id="densityValue">0.20</span>
  <div id="stats">
    <span id="steps">Steps: 0</span>
    <span id="openSize">Open Set: 0</span>
    <span id="pathLength">Path: 0</span>
  </div>
</div>

<div id="grid"></div>

<script src="astar.js" defer></script>
</body>
</html>
